version: '3.9'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    user: "0:0"
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  configserver:
    build: ./configserver
    container_name: configserver
    ports:
      - "8888:8888"
    depends_on:
      - kafka

  eureka-service:
    build: ./eureka-service
    container_name: eureka-service
    ports:
      - "8761:8761"

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - eureka-service
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/HotelAuthdb
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka
    expose:
      - "8001"

  hotel-service:
    build: ./hotel-service
    container_name: hotel-service
    depends_on:
      - eureka-service
      - mongodb
      - configserver
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/Hoteldb
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka
    expose:
      - "8002"

  booking-service:
    build: ./booking-service
    container_name: booking-service
    depends_on:
      - eureka-service
      - kafka
      - mongodb
      - configserver
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/HotelBookingdb
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    expose:
      - "8003"

  apigateway:
    build: ./apigateway
    container_name: apigateway
    ports:
      - "8008:8008"
    depends_on:
      - eureka-service

  notification-service:
    build: ./notification
    container_name: notification-service
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8010:8010"
volumes:
  mongodb_data:
